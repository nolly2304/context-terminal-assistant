[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cta"
version = "0.1.0"
description = "Context-based Terminal Assistant (Honours Stage Project LBS-26-1112)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Oluwapelumi Adunola" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cta-analyse = "cta.analysis.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
